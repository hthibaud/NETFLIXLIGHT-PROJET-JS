<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sekuya&display=swap">

  <style>
    .font-dosis {
      font-family: 'Dosis', sans-serif;
    }
    .font-sekuya {
        font-family: 'Sekuya', sans-serif;
    }
</style>



  <script src="https://cdn.tailwindcss.com"></script>

  <title>Movies</title>

  <link rel="icon" type="image/png" href="../static/img/logo-f-purple.png">
  <link rel="image" type="image/jpg" href="../static/img/blurred_movies.jpg">


</head>


<body class= "min-h-screen
             bg-[url('../static/img/blurred_movies.jpg')]
             bg-cover bg-center bg-no-repeat">

    <header class="bg-indigo-950 p-10 text-fuchsia-400 relative">

        <h1 class="font-sekuya text-left text-7xl font-bold">FLIXPORK</h1>
      <h6 class="font-dosis text-left text-4xl">Our movies</h6>

<div class="absolute bottom-5 right-5 flex items-center gap-6">
        
        <button id="favBtn" 
                class="font-dosis text-fuchsia-400 text-lg hover:text-white transition-colors uppercase cursor-pointer">
            Favorites
        </button>

        <button id="watchlistBtn" 
                class="font-dosis text-fuchsia-400 text-lg hover:text-white transition-colors uppercase cursor-pointer">
            Watchlist
        </button>

          <button id="avatarBtn" 
            class="w-12 h-12 rounded-full border-2 border-fuchsia-500 
                   overflow-hidden shadow-lg hover:scale-110 
                   hover:border-fuchsia-300 transition-all duration-300">
      
      <img src="/static/img/icon-persona.png" 
           alt="User Avatar" 
           class="w-full h-full object-cover">
           
    </button>
</div>


    </header>

    <main class="p-10 space-y-1">

      <section>
        <h2 class="text-3xl text-fuchsia-300 mb-4 font-dosis"><br>Popular</br></h2>
    <div id="popular" class="flex overflow-x-auto overflow-y-hidden gap-6 p-4 whitespace-normal scroll-smooth"></div>
      </section>

      <section>
        <h2 class="text-3xl text-fuchsia-300 mb-4 font-dosis"><br>Top rated</br></h2>
    <div id="top-rated" class="flex overflow-x-auto overflow-y-hidden gap-6 p-4 whitespace-normal scroll-smooth"></div>
      </section>

      <section>
        <h2 class="text-3xl text-fuchsia-300 mb-4 font-dosis"><br>Upcoming</br></h2>
    <div id="upcoming" class="flex overflow-x-auto overflow-y-hidden gap-6 p-4 whitespace-normal scroll-smooth"></div>
      </section>

      <section>
        <h2 class="text-3xl text-fuchsia-300 mb-4 font-dosis"><br>Now playing</br></h2>
    <div id="now_playing" class="flex overflow-x-auto overflow-y-hidden gap-6 p-4 whitespace-normal scroll-smooth"></div>
      </section>

      <section>
        <h2 class="text-3xl text-fuchsia-300 mb-4 font-dosis"><br>Comedy</br></h2>
    <div id="comedy" class="flex overflow-x-auto overflow-y-hidden gap-6 p-4 whitespace-normal scroll-smooth"></div>
      </section>

    <section>
        <h2 class="text-3xl text-fuchsia-300 mb-4 font-dosis"><br>Action</br></h2>
    <div id="action" class="flex overflow-x-auto overflow-y-hidden gap-6 p-4 whitespace-normal scroll-smooth"></div>
      </section>

          <section>
        <h2 class="text-3xl text-fuchsia-300 mb-4 font-dosis"><br>Drama</br></h2>
    <div id="drama" class="flex overflow-x-auto overflow-y-hidden gap-6 p-4 whitespace-normal scroll-smooth"></div>
      </section>

     </main>


      <footer class="bg-indigo-950 p-10 text-fuchsia-400 relative">

        <h1 class="font-sekuya text-left text-7xl font-bold">FLIXPORK</h1>

      <div class = "absolute bottom-4 right-10 flex items-center gap-4">

        <h6 class = "font-dosis text-fuchsia-400" >
        Your profile
      </h6>

  <button id="avatar2Btn" 
            class="w-12 h-12 rounded-full border-2 border-fuchsia-500 
                   overflow-hidden shadow-lg hover:scale-110 
                   hover:border-fuchsia-300 transition-all duration-300">
      
      <img src="/static/img/icon-persona.png" 
           alt="User Avatar" 
           class="w-full h-full object-cover">
           
    </button>

</div>

</footer>


    <style>
  /* Hides the scrollbar */
  #drama::-webkit-scrollbar,
  #now_playing::-webkit-scrollbar,
  #popular::-webkit-scrollbar, 
  #upcoming::-webkit-scrollbar, 
  #top-rated::-webkit-scrollbar,
  #action::-webkit-scrollbar
   {
    display: none;
  }

  /* Hides the scrollbar */
  #drama, #now_playing, #popular, #upcoming, #top-rated, #action {
    -ms-overflow-style: none;
    scrollbar-width: none;  
  }
</style>

  <script type="module" src="../../api/carroussel.js"></script>
  <script type="module" src="../../api/profile.js"></script>

</body>
</html>
